<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-basic">
                <img id="profileAvatar" class="profile-avatar" src="" alt="头像">
                <div class="profile-meta">
                    <h2 id="profileUserName">-</h2>
                    <p id="profileStatus">状态：-</p>
                </div>
            </div>
            <div class="profile-actions">
                <button type="button" class="layui-btn" id="editProfileButton">修改信息</button>
                <button type="button" class="layui-btn layui-btn-primary" id="changePasswordButton">修改密码</button>
            </div>
        </div>

        <div class="profile-grid">
            <div class="profile-item">
                <span class="profile-item-label">手机号</span>
                <span class="profile-item-value" id="profilePhone">-</span>
            </div>
            <div class="profile-item">
                <span class="profile-item-label">邮箱</span>
                <span class="profile-item-value" id="profileEmail">-</span>
            </div>
            <div class="profile-item">
                <span class="profile-item-label">创建时间</span>
                <span class="profile-item-value" id="profileCreateAt">-</span>
            </div>
            <div class="profile-item">
                <span class="profile-item-label">最后登录时间</span>
                <span class="profile-item-value" id="profileLastLoginTime">-</span>
            </div>
        </div>
    </div>
</div>

<script type="text/html" id="profileFormTpl">
    <form class="layui-form popup-form" lay-filter="profileForm">
        <div class="layui-form-item">
            <label class="layui-form-label">手机号</label>
            <div class="layui-input-block">
                <input type="text" name="userPhone" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">邮箱</label>
            <div class="layui-input-block">
                <input type="text" name="userEmail" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">头像URL</label>
            <div class="layui-input-block">
                <input type="text" name="userAvatar" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="saveProfile">保存</button>
        </div>
    </form>
</script>

<script type="text/html" id="passwordFormTpl">
    <form class="layui-form popup-form">
        <div class="layui-form-item">
            <label class="layui-form-label">原密码</label>
            <div class="layui-input-block">
                <input type="password" name="oldPwd" required lay-verify="required" autocomplete="current-password" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">新密码</label>
            <div class="layui-input-block">
                <input type="password" name="newPwd" required lay-verify="required" autocomplete="new-password" class="layui-input">
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="savePassword">保存</button>
        </div>
    </form>
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="./js/request.js"></script>
<script>
layui.use(["layer", "form"], function () {
    var layer = layui.layer;
    var form = layui.form;
    var currentUser = null;

    loadProfile();

    document.getElementById("editProfileButton").addEventListener("click", openProfileDialog);
    document.getElementById("changePasswordButton").addEventListener("click", openPasswordDialog);

    async function loadProfile() {
        try {
            var result = await AppRequest.request("/api/current-user", {method: "GET"});
            currentUser = result.data || {};
            renderProfile(currentUser);
        } catch (error) {
            layer.msg(error.message || "加载个人信息失败", {icon: 2, time: 1800});
        }
    }

    function renderProfile(data) {
        document.getElementById("profileAvatar").src = data.userAvatar || "https://api.dicebear.com/8.x/initials/svg?seed=" + encodeURIComponent(data.userName || "user");
        document.getElementById("profileUserName").textContent = data.userName || "-";
        document.getElementById("profileStatus").textContent = "状态：" + (data.status === 1 ? "启用" : "禁用");
        document.getElementById("profilePhone").textContent = data.userPhone || "-";
        document.getElementById("profileEmail").textContent = data.userEmail || "-";
        document.getElementById("profileCreateAt").textContent = AppRequest.formatDateTime(data.createAt);
        document.getElementById("profileLastLoginTime").textContent = AppRequest.formatDateTime(data.lastLoginTime);
    }

    function openProfileDialog() {
        var index = layer.open({
            type: 1,
            title: "修改信息",
            area: ["520px", "360px"],
            content: document.getElementById("profileFormTpl").innerHTML,
            success: function (layero) {
                form.render();
                form.val("profileForm", {
                    userPhone: currentUser.userPhone || "",
                    userEmail: currentUser.userEmail || "",
                    userAvatar: currentUser.userAvatar || ""
                });
                layero.find('[data-action="close"]').on("click", function () {
                    layer.close(index);
                });
            }
        });
    }

    function openPasswordDialog() {
        var index = layer.open({
            type: 1,
            title: "修改密码",
            area: ["500px", "300px"],
            content: document.getElementById("passwordFormTpl").innerHTML,
            success: function (layero) {
                form.render();
                layero.find('[data-action="close"]').on("click", function () {
                    layer.close(index);
                });
            }
        });
    }

    form.on("submit(saveProfile)", async function (data) {
        try {
            var result = await AppRequest.request("/api/user/updateSelf", {
                method: "PUT",
                body: data.field
            });
            currentUser = result.data || {};
            renderProfile(currentUser);
            layer.closeAll("page");
            layer.msg("保存成功", {icon: 1, time: 1200});
        } catch (error) {
            layer.msg(error.message || "保存失败", {icon: 2, time: 1800});
        }
        return false;
    });

    form.on("submit(savePassword)", async function (data) {
        try {
            await AppRequest.request("/api/user/changePassword", {
                method: "POST",
                body: data.field
            });
            layer.closeAll("page");
            layer.msg("密码修改成功", {icon: 1, time: 1200});
        } catch (error) {
            layer.msg(error.message || "密码修改失败", {icon: 2, time: 1800});
        }
        return false;
    });
});
</script>
</body>
</html>

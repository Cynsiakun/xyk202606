<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/alert-notifier.css">
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="app-header-left">
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="切换菜单">
                <i class="layui-icon layui-icon-shrink-right"></i>
            </button>
            <div class="brand-block">
                <span class="brand-title">后台管理系统</span>
                <span class="brand-subtitle">Spring Boot 3 + MyBatis</span>
            </div>
        </div>
        <div class="app-header-right">
            <button type="button" class="license-strip" id="licenseStrip" aria-label="License 状态">
                <span class="license-pill muted" id="tenantBadge">Tenant -</span>
                <span class="license-pill muted" id="licenseBadge">License -</span>
                <span class="license-pill muted" id="quotaBadge">Quota -</span>
            </button>
            <button type="button" class="layui-btn layui-btn-primary" id="profileButton">
                <i class="layui-icon layui-icon-username"></i> 个人信息
            </button>
            <div class="current-user">
                <span class="current-user-label">当前用户</span>
                <strong id="currentUserName">未登录</strong>
            </div>
            <button type="button" class="layui-btn layui-btn-danger logout-button" id="logoutButton">退出登录</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="app-sidebar" id="appSidebar">
            <ul class="layui-nav layui-nav-tree app-nav" lay-filter="sideNav" id="sideNav"></ul>
        </aside>

        <main class="app-main">
            <div class="content-header">
                <div>
                    <h2 id="pageTitle">后台主页</h2>
                    <p id="pageDescription">查看用户、登录和活跃情况统计。</p>
                </div>
            </div>
            <div class="content-frame-wrapper">
                <iframe id="contentFrame" class="content-frame" src="./pages/dashboard.html" title="页面内容"></iframe>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="./js/common/auth.js"></script>
<script src="./js/common/utils.js"></script>
<script src="./js/common/dialog.js"></script>
<script src="./js/common/request.js"></script>
<script src="./js/common/table.js"></script>
<script src="./js/pages/index.js"></script>
<script src="./js/common/alert-notifier.js"></script>
</body>
</html>

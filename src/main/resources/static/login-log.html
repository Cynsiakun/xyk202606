<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录日志</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="searchForm">
            <div class="toolbar-group">
                <input type="text" name="userName" placeholder="按用户名搜索" autocomplete="off" class="layui-input toolbar-input">
                <select name="status">
                    <option value="">全部状态</option>
                    <option value="1">成功</option>
                    <option value="0">失败</option>
                </select>
                <button type="submit" class="layui-btn" lay-submit lay-filter="searchSubmit">搜索</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetButton">重置</button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <table id="logTable" lay-filter="logTable"></table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="./js/request.js"></script>
<script>
layui.use(["table", "form"], function () {
    var table = layui.table;
    var form = layui.form;

    table.render({
        elem: "#logTable",
        url: "/api/login-log/list",
        method: "GET",
        headers: {Authorization: "Bearer " + AppRequest.getToken()},
        page: true,
        limit: 10,
        limits: [10, 20, 50],
        request: {pageName: "page", limitName: "size"},
        parseData: function (res) {
            var pageData = res.data || {};
            return {
                code: res.code === 200 ? 0 : res.code,
                msg: res.message,
                count: pageData.total || 0,
                data: pageData.list || []
            };
        },
        cols: [[
            {field: "id", title: "ID", width: 80, sort: true},
            {field: "userName", title: "用户名", minWidth: 140},
            {field: "loginTime", title: "登录时间", minWidth: 180, templet: function (d) { return AppRequest.formatDateTime(d.loginTime); }},
            {field: "ipAddress", title: "IP地址", minWidth: 140},
            {field: "status", title: "状态", width: 100, templet: function (d) {
                return d.status === 1 ? '<span class="status-tag success">成功</span>' : '<span class="status-tag fail">失败</span>';
            }},
            {field: "message", title: "消息", minWidth: 180}
        ]]
    });

    form.on("submit(searchSubmit)", function (data) {
        table.reload("logTable", {
            page: {curr: 1},
            where: {
                userName: data.field.userName || "",
                status: data.field.status === "" ? null : data.field.status
            }
        });
        return false;
    });

    document.getElementById("resetButton").addEventListener("click", function () {
        form.val("searchForm", {userName: "", status: ""});
        table.reload("logTable", {page: {curr: 1}, where: {userName: "", status: null}});
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - 登录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
<div class="login-shell">
    <div class="login-card">
        <div class="login-brand">
            <h1>后台管理系统</h1>
            <p class="login-subtitle">Spring Boot 3 + MyBatis</p>
            <p class="login-description">请选择租户后输入账号密码登录。</p>
        </div>
        <form class="layui-form login-form" id="loginForm">
            <div class="layui-form-item">
                <label class="login-label" for="tenantId">租户</label>
                <div class="layui-input-wrap">
                    <select id="tenantId" name="tenantId" lay-verify="required">
                        <option value="">加载中...</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="login-label" for="userName">用户名</label>
                <div class="layui-input-wrap">
                    <input type="text" id="userName" name="userName" placeholder="请输入用户名" autocomplete="username"
                           lay-verify="userName" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="login-label" for="password">密码</label>
                <div class="layui-input-wrap">
                    <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="current-password"
                           lay-verify="password" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <button class="layui-btn login-submit" id="loginSubmitButton" lay-submit lay-filter="loginSubmit" type="submit">登录</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="./js/common/auth.js"></script>
<script src="./js/common/utils.js"></script>
<script src="./js/common/dialog.js"></script>
<script src="./js/common/request.js"></script>
<script src="./js/pages/login.js"></script>
</body>
</html>

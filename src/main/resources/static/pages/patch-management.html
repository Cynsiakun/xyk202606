<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>补丁管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/host.css">
    <link rel="stylesheet" href="../css/patch-management.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="patchSearchForm">
            <div class="toolbar-group">
                <input type="text" name="keyword" placeholder="按补丁号 / 产品名称搜索" autocomplete="off" class="layui-input toolbar-input">
                <select name="installStatus">
                    <option value="">全部状态</option>
                    <option value="Installed">Installed</option>
                    <option value="Failed">Failed</option>
                    <option value="Partial">Partial</option>
                    <option value="Pending">Pending</option>
                </select>
                <button type="submit" class="layui-btn" lay-submit lay-filter="patchSearchSubmit">搜索</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetButton">重置</button>
            </div>
            <div class="toolbar-group">
                <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
                <button type="button" class="layui-btn layui-btn-danger" id="batchDeleteButton">
                    <i class="layui-icon layui-icon-delete"></i> 批量删除
                </button>
                <button type="button" class="layui-btn" id="addButton">
                    <i class="layui-icon layui-icon-add-1"></i> 新增补丁
                </button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <table id="patchTable" lay-filter="patchTable"></table>
    </div>
</div>

<template id="patchFormTemplate">
    <form class="layui-form popup-form patch-form" lay-filter="patchForm">
        <div class="patch-form-fields">
            <div class="layui-form-item">
                <label class="layui-form-label">主机ID</label>
                <div class="layui-input-block">
                    <input type="number" name="hostId" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">补丁编号</label>
                <div class="layui-input-block">
                    <input type="text" name="patchId" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">补丁类型</label>
                <div class="layui-input-block">
                    <input type="text" name="patchType" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">产品名称</label>
                <div class="layui-input-block">
                    <input type="text" name="productName" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">产品版本</label>
                <div class="layui-input-block">
                    <input type="text" name="productVersion" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">安装时间</label>
                <div class="layui-input-block">
                    <input type="datetime-local" name="installTime" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">安装状态</label>
                <div class="layui-input-block">
                    <input type="text" name="installStatus" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">来源</label>
                <div class="layui-input-block">
                    <input type="text" name="source" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">签名状态</label>
                <div class="layui-input-block">
                    <input type="text" name="signatureStatus" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">需重启</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="rebootRequired" lay-skin="switch" lay-text="是|否">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">安全补丁</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="isSecurityPatch" lay-skin="switch" lay-text="是|否">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">被替代补丁</label>
                <div class="layui-input-block">
                    <input type="text" name="supersededBy" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">原始数据</label>
                <div class="layui-input-block">
                    <textarea name="rawData" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">扫描时间</label>
                <div class="layui-input-block">
                    <input type="datetime-local" name="scanTime" autocomplete="off" class="layui-input">
                </div>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="savePatch">保存</button>
        </div>
    </form>
</template>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/patch-management.js"></script>
</body>
</html>

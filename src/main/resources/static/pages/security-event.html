<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全事件</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/security-event.css">
</head>
<body class="page-body">
<div class="page-shell">
    <!-- 顶部统计卡片 -->
    <div class="evt-stat-grid">
        <div class="evt-stat-card stat-critical">
            <div class="evt-stat-icon"><i class="layui-icon layui-icon-fire"></i></div>
            <div class="evt-stat-body">
                <div class="evt-stat-value" id="statCritical">0</div>
                <div class="evt-stat-label">Critical 告警</div>
            </div>
        </div>
        <div class="evt-stat-card stat-high">
            <div class="evt-stat-icon"><i class="layui-icon layui-icon-notice"></i></div>
            <div class="evt-stat-body">
                <div class="evt-stat-value" id="statHigh">0</div>
                <div class="evt-stat-label">High 告警</div>
            </div>
        </div>
        <div class="evt-stat-card stat-medium">
            <div class="evt-stat-icon"><i class="layui-icon layui-icon-tips"></i></div>
            <div class="evt-stat-body">
                <div class="evt-stat-value" id="statMedium">0</div>
                <div class="evt-stat-label">Medium 告警</div>
            </div>
        </div>
        <div class="evt-stat-card stat-untreated">
            <div class="evt-stat-icon"><i class="layui-icon layui-icon-survey"></i></div>
            <div class="evt-stat-body">
                <div class="evt-stat-value" id="statUntreated">0</div>
                <div class="evt-stat-label">未处理</div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar-card evt-toolbar">
        <div class="evt-filter-left">
            <div class="evt-level-tabs" id="levelTabs">
                <button type="button" class="evt-level-tab is-active" data-level="">All</button>
                <button type="button" class="evt-level-tab" data-level="Critical">Critical</button>
                <button type="button" class="evt-level-tab" data-level="High">High</button>
                <button type="button" class="evt-level-tab" data-level="Medium">Medium</button>
            </div>
            <div class="layui-form evt-status-filter" lay-filter="statusFilterForm">
                <select name="status" id="statusSelect" lay-filter="statusSelect">
                    <option value="">全部状态</option>
                    <option value="new">New</option>
                    <option value="acked">Acked</option>
                    <option value="resolved">Resolved</option>
                </select>
            </div>
        </div>

        <div class="evt-search-box">
            <input type="text" id="keywordInput" placeholder="搜索主机名 / 描述关键字" autocomplete="off" class="layui-input">
            <button type="button" class="layui-btn" id="searchButton">
                <i class="layui-icon layui-icon-search"></i> 搜索
            </button>
        </div>

        <div class="evt-actions">
            <button type="button" class="layui-btn layui-btn-primary" id="advSearchButton">
                <i class="layui-icon layui-icon-find-fill"></i> 高级搜索
            </button>
            <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                <i class="layui-icon layui-icon-refresh"></i> 刷新
            </button>
            <button type="button" class="layui-btn layui-btn-normal" id="exportButton">
                <i class="layui-icon layui-icon-export"></i> 导出
            </button>
        </div>
    </div>

    <!-- 批量操作条 -->
    <div class="evt-batch-bar">
        <span class="evt-batch-hint" id="batchHint">已选 0 条</span>
        <button type="button" class="layui-btn layui-btn-sm" id="batchAckButton">
            <i class="layui-icon layui-icon-ok"></i> 批量确认
        </button>
        <button type="button" class="layui-btn layui-btn-sm layui-btn-normal" id="batchResolveButton">
            <i class="layui-icon layui-icon-ok-circle"></i> 批量处理
        </button>
    </div>

    <!-- 当前生效的高级筛选条件 -->
    <div class="active-filter-bar" id="activeFilterBar" style="display:none;"></div>

    <!-- 安全事件表格 -->
    <div class="table-card">
        <table id="eventTable" lay-filter="eventTable"></table>
    </div>
</div>

<!-- 等级标签模板 -->
<script type="text/html" id="levelTpl">
    {{# var lv = (d.level || '').toLowerCase(); }}
    {{# if (lv === 'critical') { }}
    <span class="evt-tag evt-critical">Critical</span>
    {{# } else if (lv === 'high') { }}
    <span class="evt-tag evt-high">High</span>
    {{# } else if (lv === 'medium') { }}
    <span class="evt-tag evt-medium">Medium</span>
    {{# } else { }}
    <span class="evt-tag evt-low">{{ d.level || '-' }}</span>
    {{# } }}
</script>

<!-- 状态标签模板 -->
<script type="text/html" id="statusTpl">
    {{# var st = (d.status || '').toLowerCase(); }}
    {{# if (st === 'new') { }}
    <span class="status-pill status-new">New</span>
    {{# } else if (st === 'acked') { }}
    <span class="status-pill status-acked">Acked</span>
    {{# } else if (st === 'resolved') { }}
    <span class="status-pill status-resolved">Resolved</span>
    {{# } else { }}
    <span class="status-pill status-other">{{ d.status || '-' }}</span>
    {{# } }}
</script>

<!-- 主机列模板 -->
<script type="text/html" id="hostTpl">
    {{# if (d.hostname) { }}
    <div class="host-cell"><strong>{{ d.hostname }}</strong><span>{{ d.ipv4 || '' }}</span></div>
    {{# } else { }}
    <span>#{{ d.hostId }}</span>
    {{# } }}
</script>

<!-- 操作列模板 -->
<script type="text/html" id="opTpl">
    <div class="evt-op">
        <button type="button" class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail">详情</button>
        {{# if ((d.status||'').toLowerCase() === 'new') { }}
        <button type="button" class="layui-btn layui-btn-xs" lay-event="ack">确认</button>
        {{# } }}
        {{# if ((d.status||'').toLowerCase() !== 'resolved') { }}
        <button type="button" class="layui-btn layui-btn-normal layui-btn-xs" lay-event="resolve">已处理</button>
        {{# } }}
    </div>
</script>

<!-- 高级搜索弹窗模板 -->
<script type="text/html" id="advSearchTemplate">
    <form class="layui-form adv-search-form" lay-filter="advSearchForm">
        <div class="layui-form-item">
            <label class="layui-form-label">EventID</label>
            <div class="layui-input-block">
                <input type="text" name="eventId" placeholder="精确匹配事件ID" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">主机</label>
            <div class="layui-input-block">
                <select name="hostId" id="advHostSelect">
                    <option value="">全部主机</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">告警名称</label>
            <div class="layui-input-block">
                <input type="text" name="alertName" placeholder="告警名称包含" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">告警时间</label>
            <div class="layui-input-block">
                <input type="text" name="timeRange" id="advTimeRange" placeholder="选择起止时间" autocomplete="off" class="layui-input" readonly>
            </div>
        </div>
        <div class="layui-form-item adv-search-actions">
            <button type="button" class="layui-btn" id="advQueryButton">查询</button>
            <button type="button" class="layui-btn layui-btn-primary" id="advResetButton">重置</button>
        </div>
    </form>
</script>

<!-- 详情抽屉模板 -->
<script type="text/html" id="eventDetailTemplate">
    <div class="evt-detail-drawer">
        <div class="layui-tab layui-tab-brief evt-detail-tab" lay-filter="evtDetailTab">
            <ul class="layui-tab-title">
                <li class="layui-this">事件详情</li>
                <li>关联原始日志</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="detail-kv-grid" id="detailKvGrid"></div>
                    <div class="detail-message-block">
                        <div class="detail-message-label">描述 Description</div>
                        <div class="detail-message-text" id="detailDescription"></div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="detail-kv-grid" id="detailLogKvGrid"></div>
                    <div class="detail-message-block">
                        <div class="detail-message-label">日志摘要 Message</div>
                        <div class="detail-message-text" id="detailLogMessage"></div>
                    </div>
                    <div class="detail-message-block">
                        <div class="detail-message-label raw-xml-label">
                            <span>原始 XML（raw_xml）</span>
                            <button type="button" class="layui-btn layui-btn-primary layui-btn-xs" id="copyXmlButton">
                                <i class="layui-icon layui-icon-file-b"></i> 复制
                            </button>
                        </div>
                        <pre class="raw-xml-pre" id="detailRawXml"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/security-event.js"></script>
</body>
</html>

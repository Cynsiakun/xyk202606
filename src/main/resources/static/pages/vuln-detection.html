<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漏洞检测</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/vuln-detection.css">
</head>
<body class="page-body">
<div class="page-shell vuln-page">
    <section class="vuln-overview">
        <div class="overview-head">
            <div>
                <div class="section-kicker">Host Vulnerability View</div>
                <h1>漏洞检测</h1>
            </div>
            <div class="overview-actions">
                <button type="button" class="icon-btn" id="refreshButton" title="刷新">
                    <i class="layui-icon layui-icon-refresh"></i>
                </button>
                <button type="button" class="primary-btn amber" id="batchVerifyButton">
                    <i class="layui-icon layui-icon-release"></i> 批量验证
                </button>
                <button type="button" class="primary-btn blue" id="rematchButton">
                    <i class="layui-icon layui-icon-search"></i> 重新匹配
                </button>
            </div>
        </div>

        <div class="view-switch" id="viewSwitch">
            <button type="button" class="view-tab is-active" data-view="host">主机视角</button>
            <button type="button" class="view-tab" data-view="vuln">漏洞视角</button>
        </div>

        <div class="dashboard-grid" id="hostDashboard">
            <div class="risk-panel">
                <div class="panel-title">
                    <span>风险分布</span>
                    <strong id="riskTotal">0</strong>
                </div>
                <div class="risk-segment" id="riskSegment"></div>
                <div class="risk-metrics" id="severityMetrics"></div>
            </div>

            <div class="status-panel">
                <div class="panel-title">
                    <span>状态流转</span>
                    <strong id="statusTotal">0</strong>
                </div>
                <div class="status-metrics" id="statusMetrics"></div>
            </div>
        </div>
    </section>

    <section class="host-board view-panel is-active" id="hostViewPanel">
        <div class="board-toolbar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input id="hostSearchInput" type="search" placeholder="搜索主机名 / IP / MAC">
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button type="button" class="filter-tab is-active" data-filter="all">全部主机</button>
                <button type="button" class="filter-tab" data-filter="pending">有待验证</button>
                <button type="button" class="filter-tab" data-filter="verifying">验证中</button>
                <button type="button" class="filter-tab" data-filter="verified">已验证</button>
                <button type="button" class="filter-tab" data-filter="repair">待修复</button>
                <button type="button" class="filter-tab" data-filter="fixed">已修复</button>
            </div>
        </div>

        <div class="host-card-grid" id="hostCardGrid"></div>
        <div class="host-empty" id="hostEmpty">
            <div class="empty-icon"><i class="layui-icon layui-icon-template-1"></i></div>
            <h3>暂无主机漏洞结果</h3>
            <p>请调整搜索条件，或在资产与规则更新后重新匹配。</p>
        </div>
    </section>

    <section class="vuln-board view-panel" id="vulnViewPanel">
        <div class="vuln-summary-grid">
            <div class="vuln-summary-card total">
                <span>漏洞总数</span>
                <strong id="vulnTotalKinds">0</strong>
                <em>种漏洞</em>
            </div>
            <div class="vuln-summary-card pending">
                <span>待验证漏洞数</span>
                <strong id="vulnPendingKinds">0</strong>
            </div>
            <div class="vuln-summary-card verifying">
                <span>验证中漏洞数</span>
                <strong id="vulnVerifyingKinds">0</strong>
            </div>
            <div class="vuln-summary-card repair">
                <span>待修复漏洞数</span>
                <strong id="vulnRepairKinds">0</strong>
            </div>
        </div>

        <div class="vuln-filter-bar">
            <div class="search-box">
                <i class="layui-icon layui-icon-search"></i>
                <input id="vulnSearchInput" type="search" placeholder="搜索漏洞名称 / CVE / 规则ID">
            </div>
            <details class="multi-filter" id="severityFilter">
                <summary>风险等级</summary>
                <div class="multi-filter-menu">
                    <button type="button" data-value="critical">严重</button>
                    <button type="button" data-value="high">高危</button>
                    <button type="button" data-value="medium">中危</button>
                    <button type="button" data-value="low">低危</button>
                </div>
            </details>
            <details class="multi-filter" id="vulnStatusFilter">
                <summary>状态筛选</summary>
                <div class="multi-filter-menu">
                    <button type="button" data-value="pending">待验证</button>
                    <button type="button" data-value="verifying">验证中</button>
                    <button type="button" data-value="repair">待修复</button>
                </div>
            </details>
        </div>

        <div class="vuln-card-grid" id="vulnCardGrid"></div>
        <div class="host-empty" id="vulnEmpty">
            <div class="empty-icon"><i class="layui-icon layui-icon-template-1"></i></div>
            <h3>暂无漏洞视角结果</h3>
            <p>请调整筛选条件，或在静态匹配完成后刷新页面。</p>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/pages/vuln-detection.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>套餐中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/license-center.css">
</head>
<body class="page-body">
<div class="page-shell license-center-page">
    <section class="license-overview">
        <div>
            <div class="section-kicker">License</div>
            <h2 id="currentEdition">当前套餐</h2>
            <p id="licenseMeta">正在加载授权状态</p>
        </div>
        <div class="license-actions" id="licenseActions"></div>
    </section>

    <section class="quota-grid">
        <div class="quota-panel">
            <div class="quota-head">
                <span>主机配额</span>
                <strong id="hostQuotaText">-</strong>
            </div>
            <div class="quota-track"><span id="hostQuotaBar"></span></div>
        </div>
        <div class="quota-panel">
            <div class="quota-head">
                <span>用户配额</span>
                <strong id="userQuotaText">-</strong>
            </div>
            <div class="quota-track"><span id="userQuotaBar"></span></div>
        </div>
    </section>

    <section class="plan-section">
        <div class="section-head">
            <div>
                <div class="section-kicker">Plans</div>
                <h3>套餐列表</h3>
            </div>
            <span id="planSourceTip">数据来自平台套餐接口</span>
        </div>
        <div class="plan-grid" id="planGrid"></div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/pages/license-center.js"></script>
</body>
</html>

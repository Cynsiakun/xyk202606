<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录日志</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/log.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="searchForm">
            <div class="toolbar-group">
                <input type="text" name="userName" placeholder="按用户名搜索" autocomplete="off" class="layui-input toolbar-input">
                <select name="status">
                    <option value="">全部状态</option>
                    <option value="1">成功</option>
                    <option value="0">失败</option>
                </select>
                <button type="submit" class="layui-btn" lay-submit lay-filter="searchSubmit">搜索</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetButton">重置</button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <table id="logTable" lay-filter="logTable"></table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/log.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全态势首页</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body class="page-body dashboard-body">
<div class="page-shell dashboard-shell">
    <section class="dashboard-hero content-card">
        <div class="dashboard-hero-copy">
            <div class="dashboard-kicker">Threat Intelligence Home</div>
            <h1>安全态势总览</h1>
            <p>聚合资产画像、基线核查、漏洞处置、补丁风险与日志告警，用更紧凑的布局展示当前平台的安全状态。</p>
        </div>
        <div class="dashboard-hero-meta">
            <button type="button" class="layui-btn dashboard-screen-button" id="openThreatScreenButton">进入态势大屏</button>
            <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">刷新数据</button>
            <span id="lastUpdatedLabel">-</span>
        </div>
    </section>

    <section class="metric-strip" id="metricStrip"></section>

    <section class="dashboard-main-grid">
        <article class="content-card panel panel-star">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Central Situation</div>
                    <h2>主机态势星环</h2>
                </div>
                <div class="panel-meta" id="starRingMeta">-</div>
            </div>
            <div class="star-ring-wrap">
                <div class="star-ring-chart" id="starRingChart"></div>
            </div>
        </article>

        <article class="content-card panel">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Asset Mix</div>
                    <h2>资产分类分布</h2>
                </div>
            </div>
            <div class="chart-box chart-box-medium" id="assetCategoryChart"></div>
        </article>

        <article class="content-card panel">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Product Ranking</div>
                    <h2>TOP 服务 / 产品</h2>
                </div>
            </div>
            <div class="chart-box chart-box-medium" id="topProductChart"></div>
        </article>

        <article class="content-card panel">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Baseline Status</div>
                    <h2>基线结果状态</h2>
                </div>
            </div>
            <div class="chart-box chart-box-small" id="baselineStatusChart"></div>
        </article>

        <article class="content-card panel">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Vulnerability Severity</div>
                    <h2>漏洞严重度金字塔</h2>
                </div>
            </div>
            <div class="chart-box chart-box-small" id="severityChart"></div>
        </article>

        <article class="content-card panel panel-wide">
            <div class="panel-head">
                <div>
                    <div class="panel-kicker">Disposition Funnel</div>
                    <h2>漏洞处置阶段漏斗</h2>
                </div>
            </div>
            <div class="chart-box chart-box-small" id="funnelChart"></div>
        </article>

        <article class="content-card panel panel-wide">
            <div class="panel-head panel-head-tabs">
                <div>
                    <div class="panel-kicker">Risk Trends</div>
                    <h2 id="trendTitle">风险趋势</h2>
                    <div class="panel-meta" id="trendSubtitle">-</div>
                </div>
                <div class="trend-tabs" id="trendTabs"></div>
            </div>
            <div class="chart-box chart-box-trend" id="trendChart"></div>
        </article>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/pages/dashboard.js"></script>
</body>
</html>

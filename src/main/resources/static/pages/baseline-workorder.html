<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全工单管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/baseline-workorder.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card" id="workorderListToolbar">
        <form class="layui-form toolbar-row" lay-filter="workorderSearchForm">
            <div class="toolbar-group">
                <div class="workorder-title">
                    <div class="section-kicker">Security Workorders</div>
                    <h1>安全工单管理</h1>
                </div>
            </div>
            <div class="toolbar-group">
                <input type="text" id="workorderKeywordInput" class="layui-input toolbar-search" placeholder="搜索工单标题 / 主机名称" autocomplete="off">
                <select name="status" lay-filter="statusFilter">
                    <option value="">全部状态</option>
                    <option value="OPEN">待处理</option>
                    <option value="PROCESSING">处理中</option>
                    <option value="DONE">已完成</option>
                </select>
                <select name="priority" lay-filter="priorityFilter">
                    <option value="">全部优先级</option>
                    <option value="LOW">LOW</option>
                    <option value="MEDIUM">MEDIUM</option>
                    <option value="HIGH">HIGH</option>
                    <option value="CRITICAL">CRITICAL</option>
                </select>
                <button type="button" class="layui-btn layui-btn-primary" id="searchButton">
                    <i class="layui-icon layui-icon-search"></i> 搜索
                </button>
                <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
            </div>
        </form>
    </div>

    <div class="table-card" id="workorderListPanel">
        <table id="workorderTable" lay-filter="workorderTable"></table>
    </div>

    <div class="table-card workorder-detail-panel" id="workorderDetailPanel" style="display:none;">
        <div class="detail-head">
            <div>
                <div class="section-kicker">Workorder Detail</div>
                <h2 id="detailTitle">工单详情</h2>
            </div>
            <div class="detail-actions">
                <button type="button" class="layui-btn layui-btn-primary" id="backToListButton">返回列表</button>
                <button type="button" class="layui-btn layui-btn-primary" id="detailRefreshButton">刷新详情</button>
                <button type="button" class="layui-btn" id="startButton">开始处理</button>
                <button type="button" class="layui-btn layui-btn-warm" id="completeButton">完成工单</button>
                <button type="button" class="layui-btn layui-btn-normal" id="recheckButton">重新检测</button>
            </div>
        </div>
        <div id="detailBody" class="detail-body"></div>
    </div>
</div>

<template id="completeFormTemplate">
    <form class="layui-form popup-form complete-form">
        <div class="layui-form-item">
            <label class="layui-form-label">处理说明</label>
            <div class="layui-input-block">
                <textarea name="closeRemark" placeholder="请填写本次人工处置的操作过程和结果" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="button" class="layui-btn" id="submitCompleteButton">确认完成</button>
        </div>
    </form>
</template>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/baseline-workorder.js"></script>
</body>
</html>

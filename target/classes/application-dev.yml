spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/xyk2026?useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 139.155.139.242
    port: 15333
    virtual-host: my_vhost
    username: admin
    password: admin
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cd.entity

# Windows 事件日志消费/批量写入参数
app:
  windows-log:
    # 消费者并发数（每个并发独立 channel）
    concurrency: 2
    # 单消费者预取数：放大以喂饱批量缓冲
    prefetch: 200
    # 缓冲队列容量：满时消费线程阻塞形成背压
    queue-capacity: 5000
    # 单批最多写入条数
    batch-size: 100
    # 单次调度最多连续处理的批数（清积压用，上限保护避免长时间占用调度线程）
    max-batches-per-tick: 50

security:
  jwt:
    secret: 1234567890123456789012345678901234567890123456789012345678901234
    expire-seconds: 86400

ai:
  api-key: ${DASHSCOPE_API_KEY:}
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
  temperature: 0.2
  max-tokens: 2048
  asset-analysis:
    service-batch-size: 25
    process-batch-size: 25
    app-batch-size: 25

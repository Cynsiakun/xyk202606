<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/role.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="roleSearchForm">
            <div class="toolbar-group">
                <input type="text" name="keyword" placeholder="按角色编码或名称搜索" autocomplete="off" class="layui-input toolbar-input">
                <button type="submit" class="layui-btn" lay-submit lay-filter="roleSearchSubmit">搜索</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetButton">重置</button>
            </div>
            <button type="button" class="layui-btn" id="addRoleButton">
                <i class="layui-icon layui-icon-add-1"></i> 新增角色
            </button>
        </form>
    </div>

    <div class="table-card">
        <table id="roleTable" lay-filter="roleTable"></table>
    </div>
</div>

<template id="roleFormTemplate">
    <form class="layui-form popup-form" lay-filter="roleForm">
        <div class="layui-form-item">
            <label class="layui-form-label">角色编码</label>
            <div class="layui-input-block">
                <input type="text" name="roleCode" required lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">角色名称</label>
            <div class="layui-input-block">
                <input type="text" name="roleName" required lay-verify="required" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">状态</label>
            <div class="layui-input-block">
                <select name="status">
                    <option value="1">启用</option>
                    <option value="0">禁用</option>
                </select>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="saveRole">保存</button>
        </div>
    </form>
</template>

<template id="rolePermissionTemplate">
    <div class="permission-dialog">
        <div class="permission-toolbar">
            <button type="button" class="layui-btn layui-btn-sm" id="checkAllPermissions">全选</button>
            <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="uncheckAllPermissions">取消全选</button>
        </div>
        <div id="permissionTree" class="permission-tree"></div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="button" class="layui-btn" id="saveRolePermissionButton">保存</button>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/role.js"></script>
</body>
</html>

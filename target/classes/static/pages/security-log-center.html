<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日志中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/security-log-center.css">
</head>
<body class="page-body">
<div class="page-shell">
    <!-- 顶部统计卡片 -->
    <div class="log-stat-grid">
        <div class="log-stat-card stat-security">
            <div class="log-stat-icon"><i class="layui-icon layui-icon-auz"></i></div>
            <div class="log-stat-body">
                <div class="log-stat-value" id="statSecurity">0</div>
                <div class="log-stat-label">今日 Security</div>
            </div>
        </div>
        <div class="log-stat-card stat-system">
            <div class="log-stat-icon"><i class="layui-icon layui-icon-set"></i></div>
            <div class="log-stat-body">
                <div class="log-stat-value" id="statSystem">0</div>
                <div class="log-stat-label">今日 System</div>
            </div>
        </div>
        <div class="log-stat-card stat-application">
            <div class="log-stat-icon"><i class="layui-icon layui-icon-app"></i></div>
            <div class="log-stat-body">
                <div class="log-stat-value" id="statApplication">0</div>
                <div class="log-stat-label">今日 Application</div>
            </div>
        </div>
        <div class="log-stat-card stat-error">
            <div class="log-stat-icon"><i class="layui-icon layui-icon-close-fill"></i></div>
            <div class="log-stat-body">
                <div class="log-stat-value" id="statError">0</div>
                <div class="log-stat-label">今日 Error</div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar-card log-toolbar">
        <div class="log-type-tabs" id="logTypeTabs">
            <button type="button" class="log-type-tab is-active" data-type="Security">Security</button>
            <button type="button" class="log-type-tab" data-type="System">System</button>
            <button type="button" class="log-type-tab" data-type="Application">Application</button>
        </div>

        <div class="log-search-box">
            <input type="text" id="keywordInput" placeholder="搜索摘要 / 用户名关键字" autocomplete="off" class="layui-input">
            <button type="button" class="layui-btn" id="searchButton">
                <i class="layui-icon layui-icon-search"></i> 搜索
            </button>
        </div>

        <div class="log-actions">
            <button type="button" class="layui-btn layui-btn-primary" id="advSearchButton">
                <i class="layui-icon layui-icon-find-fill"></i> 高级搜索
            </button>
            <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                <i class="layui-icon layui-icon-refresh"></i> 刷新
            </button>
            <div class="auto-refresh layui-form" lay-filter="autoRefreshForm">
                <input type="checkbox" id="autoRefreshSwitch" lay-skin="switch" lay-text="自动|手动" lay-filter="autoRefreshSwitch">
            </div>
            <button type="button" class="layui-btn layui-btn-normal" id="exportButton">
                <i class="layui-icon layui-icon-export"></i> 导出
            </button>
        </div>
    </div>

    <!-- 当前生效的高级筛选条件 -->
    <div class="active-filter-bar" id="activeFilterBar" style="display:none;"></div>

    <!-- 日志表格 -->
    <div class="table-card">
        <table id="logTable" lay-filter="logTable"></table>
    </div>
</div>

<!-- 等级标签模板 -->
<script type="text/html" id="levelTpl">
    {{# var lv = (d.level || '').toLowerCase(); }}
    {{# if (lv === 'information') { }}
    <span class="level-tag level-info">Information</span>
    {{# } else if (lv === 'warning') { }}
    <span class="level-tag level-warning">Warning</span>
    {{# } else if (lv === 'error') { }}
    <span class="level-tag level-error">Error</span>
    {{# } else if (lv === 'critical') { }}
    <span class="level-tag level-critical">Critical</span>
    {{# } else { }}
    <span class="level-tag level-default">{{ d.level || '-' }}</span>
    {{# } }}
</script>

<!-- 日志类型标签模板 -->
<script type="text/html" id="logTypeTpl">
    <span class="logtype-tag logtype-{{ (d.logType||'').toLowerCase() }}">{{ d.logType || '-' }}</span>
</script>

<!-- 主机列模板 -->
<script type="text/html" id="hostTpl">
    {{# if (d.hostname) { }}
    <div class="host-cell"><strong>{{ d.hostname }}</strong><span>{{ d.ipv4 || '' }}</span></div>
    {{# } else { }}
    <span>#{{ d.hostId }}</span>
    {{# } }}
</script>

<!-- 操作列模板 -->
<script type="text/html" id="opTpl">
    <button type="button" class="layui-btn layui-btn-primary layui-btn-xs" lay-event="detail">查看详情</button>
</script>

<!-- 高级搜索弹窗模板 -->
<script type="text/html" id="advSearchTemplate">
    <form class="layui-form adv-search-form" lay-filter="advSearchForm">
        <div class="layui-form-item">
            <label class="layui-form-label">EventID</label>
            <div class="layui-input-block">
                <input type="text" name="eventId" placeholder="精确匹配事件ID，如 4624" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">主机</label>
            <div class="layui-input-block">
                <select name="hostId" id="advHostSelect">
                    <option value="">全部主机</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">用户名</label>
            <div class="layui-input-block">
                <input type="text" name="username" placeholder="用户名包含" autocomplete="off" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">日志级别</label>
            <div class="layui-input-block">
                <select name="level">
                    <option value="">全部级别</option>
                    <option value="Information">Information</option>
                    <option value="Warning">Warning</option>
                    <option value="Error">Error</option>
                    <option value="Critical">Critical</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">时间范围</label>
            <div class="layui-input-block">
                <input type="text" name="timeRange" id="advTimeRange" placeholder="选择起止时间" autocomplete="off" class="layui-input" readonly>
            </div>
        </div>
        <div class="layui-form-item adv-search-actions">
            <button type="button" class="layui-btn" id="advQueryButton">查询</button>
            <button type="button" class="layui-btn layui-btn-primary" id="advResetButton">重置</button>
        </div>
    </form>
</script>

<!-- 详情抽屉模板 -->
<script type="text/html" id="logDetailTemplate">
    <div class="log-detail-drawer">
        <div class="layui-tab layui-tab-brief log-detail-tab" lay-filter="logDetailTab">
            <ul class="layui-tab-title">
                <li class="layui-this">日志详情</li>
                <li>原始 XML</li>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class="detail-kv-grid" id="detailKvGrid"></div>
                    <div class="detail-message-block">
                        <div class="detail-message-label">摘要 Message</div>
                        <div class="detail-message-text" id="detailMessage"></div>
                    </div>
                </div>
                <div class="layui-tab-item">
                    <div class="raw-xml-toolbar">
                        <button type="button" class="layui-btn layui-btn-primary layui-btn-xs" id="copyXmlButton">
                            <i class="layui-icon layui-icon-file-b"></i> 复制
                        </button>
                    </div>
                    <pre class="raw-xml-pre" id="detailRawXml"></pre>
                </div>
            </div>
        </div>
    </div>
</script>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/security-log-center.js"></script>
</body>
</html>

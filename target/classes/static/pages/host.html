<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主机管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/host.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="hostSearchForm">
            <div class="toolbar-group">
                <input type="text" name="keyword" placeholder="按主机名 / IP / MAC 搜索" autocomplete="off" class="layui-input toolbar-input">
                <button type="submit" class="layui-btn" lay-submit lay-filter="hostSearchSubmit">搜索</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resetButton">重置</button>
            </div>
            <div class="toolbar-group">
                <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
                <div class="auto-refresh-select">
                    <select name="autoRefresh" lay-filter="autoRefreshSelect">
                        <option value="0">不刷新</option>
                        <option value="1">每 1 秒刷新</option>
                        <option value="3">每 3 秒刷新</option>
                        <option value="5">每 5 秒刷新</option>
                    </select>
                </div>
                <button type="button" class="layui-btn layui-btn-normal" id="importButton">
                    <i class="layui-icon layui-icon-upload-drag"></i> 导入CSV
                </button>
                <button type="button" class="layui-btn layui-btn-primary" id="probeStrategyButton">
                    <i class="layui-icon layui-icon-set"></i> 探测策略配置
                </button>
                <button type="button" class="layui-btn" id="addHostButton">
                    <i class="layui-icon layui-icon-add-1"></i> 新增主机
                </button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <table id="hostTable" lay-filter="hostTable"></table>
    </div>
</div>

<template id="hostFormTemplate">
    <form class="layui-form popup-form host-form" lay-filter="hostForm">
        <div class="host-form-fields">
            <div class="layui-form-item">
                <label class="layui-form-label">主机名</label>
                <div class="layui-input-block">
                    <input type="text" name="hostname" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">IPv4</label>
                <div class="layui-input-block">
                    <input type="text" name="ipv4" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">MAC地址</label>
                <div class="layui-input-block">
                    <input type="text" name="macAddress" required lay-verify="required" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">操作系统</label>
                <div class="layui-input-block">
                    <input type="text" name="osName" placeholder="系统名称" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">系统版本</label>
                <div class="layui-input-block">
                    <input type="text" name="osVersion" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">系统架构</label>
                <div class="layui-input-block">
                    <input type="text" name="osArch" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">具体版本</label>
                <div class="layui-input-block">
                    <input type="text" name="osRelease" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">CPU型号</label>
                <div class="layui-input-block">
                    <input type="text" name="cpuModel" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">物理核心数</label>
                <div class="layui-input-block">
                    <input type="number" name="cpuPhysicalCores" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">逻辑核心数</label>
                <div class="layui-input-block">
                    <input type="number" name="cpuLogicalCores" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">总内存</label>
                <div class="layui-input-block">
                    <input type="text" name="memTotal" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">已使用内存</label>
                <div class="layui-input-block">
                    <input type="text" name="memUsed" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">可用内存</label>
                <div class="layui-input-block">
                    <input type="text" name="memAvailable" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">使用率</label>
                <div class="layui-input-block">
                    <input type="text" name="memUsage" autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-block">
                    <select name="status">
                        <option value="1">在线</option>
                        <option value="0">离线</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="saveHost">保存</button>
        </div>
    </form>
</template>

<template id="probeStrategyTemplate">
    <form class="layui-form popup-form" lay-filter="probeStrategyForm">
        <div class="layui-form-item">
            <label class="layui-form-label">自动探测</label>
            <div class="layui-input-block">
                <input type="checkbox" name="enabled" lay-skin="switch" lay-text="开启|关闭">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">探测周期</label>
            <div class="layui-input-block">
                <select name="periodHours">
                    <option value="1">每 1 小时</option>
                    <option value="4">每 4 小时</option>
                    <option value="8">每 8 小时</option>
                    <option value="12">每 12 小时</option>
                    <option value="24">每 24 小时</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">资产探测</label>
            <div class="layui-input-block">
                <input type="checkbox" name="account" title="账号" lay-skin="primary">
                <input type="checkbox" name="service" title="服务" lay-skin="primary">
                <input type="checkbox" name="process" title="进程" lay-skin="primary">
                <input type="checkbox" name="app" title="应用" lay-skin="primary">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">端口扫描</label>
            <div class="layui-input-block">
                <input type="checkbox" name="portScan" title="端口扫描" lay-skin="primary">
            </div>
        </div>
        <div class="probe-strategy-port-scan-options" style="display:none;">
            <div class="layui-form-item">
                <label class="layui-form-label">扫描范围</label>
                <div class="layui-input-block">
                    <select name="portScanRange">
                        <option value="common">常用端口</option>
                        <option value="full">全端口(1-65535)</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item probe-strategy-custom-ports" style="display:none;">
                <label class="layui-form-label">自定义端口</label>
                <div class="layui-input-block">
                    <input type="text" name="portScanCustomPorts" placeholder="22,80,443,3306,6379,8080" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">指纹识别</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="fingerprint" title="抓取Banner识别资产" lay-skin="primary">
                </div>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="saveProbeStrategy">保存</button>
        </div>
    </form>
</template>

<template id="assetProbeTemplate">
    <form class="layui-form popup-form" lay-filter="assetProbeForm">
        <div class="layui-form-item">
            <label class="layui-form-label">主机MAC</label>
            <div class="layui-input-block">
                <input type="text" name="macAddress" readonly class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">资产探测</label>
            <div class="layui-input-block">
                <input type="checkbox" name="account" title="探测账号" lay-skin="primary">
                <input type="checkbox" name="service" title="探测服务" lay-skin="primary">
                <input type="checkbox" name="process" title="探测进程" lay-skin="primary">
                <input type="checkbox" name="app" title="探测安装的软件" lay-skin="primary">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">端口探测</label>
            <div class="layui-input-block">
                <input type="checkbox" name="portScan" title="端口探测" lay-skin="primary">
            </div>
        </div>
        <div class="probe-port-scan-options" style="display:none;">
            <div class="layui-form-item">
                <label class="layui-form-label">扫描范围</label>
                <div class="layui-input-block">
                    <select name="portScanRange">
                        <option value="common">常用端口</option>
                        <option value="full">全端口(1-65535)</option>
                        <option value="custom">自定义</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item probe-custom-ports" style="display:none;">
                <label class="layui-form-label">自定义端口</label>
                <div class="layui-input-block">
                    <input type="text" name="portScanCustomPorts" placeholder="22,80,443,3306,6379,8080" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">指纹识别</label>
                <div class="layui-input-block">
                    <input type="checkbox" name="grabBanner" title="抓取Banner识别资产" lay-skin="primary">
                </div>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="submit" class="layui-btn" lay-submit lay-filter="startProbe">开始探测</button>
        </div>
    </form>
</template>

<template id="hostImportTemplate">
    <div class="import-dialog">
        <div class="import-dialog-body">
            <p class="import-dialog-tip">请选择 UTF-8 编码的 CSV 文件，首行为表头。系统会按 MAC 地址去重，已存在的主机会更新，不会重复插入。</p>
            <input type="file" id="hostCsvFile" accept=".csv,text/csv" class="import-file-input">
            <div class="import-file-name" id="hostCsvFileName">尚未选择文件</div>
            <div class="import-example">
                <div class="import-example-title">建议表头</div>
                <code>hostname,ipv4,mac_address,os_name,os_version,os_arch,os_release,cpu_model,cpu_physical_cores,cpu_logical_cores,mem_total,mem_used,mem_available,mem_usage,status,last_scan_time</code>
            </div>
        </div>
        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="button" class="layui-btn layui-btn-normal" id="submitImportButton">开始导入</button>
        </div>
    </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/common/asset-utils.js"></script>
<script src="../js/pages/host.js"></script>
</body>
</html>

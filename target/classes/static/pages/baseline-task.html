<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基线任务管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/css/layui.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/host.css">
    <link rel="stylesheet" href="../css/baseline-task.css">
</head>
<body class="page-body">
<div class="page-shell">
    <div class="toolbar-card">
        <form class="layui-form toolbar-row" lay-filter="baselineSearchForm">
            <div class="toolbar-group">
                <div class="baseline-title">
                    <div class="section-kicker">Compliance Baseline</div>
                    <h1>基线任务管理</h1>
                </div>
            </div>
            <div class="toolbar-group">
                <input type="text" id="taskKeywordInput" class="layui-input toolbar-search" placeholder="搜索任务名称" autocomplete="off">
                <select name="executeType" lay-filter="executeTypeFilter">
                    <option value="">全部执行方式</option>
                    <option value="MANUAL">立即执行</option>
                    <option value="SCHEDULED">定时任务</option>
                </select>
                <select name="taskType" lay-filter="taskTypeFilter">
                    <option value="">全部任务类型</option>
                    <option value="SCAN">检测任务</option>
                    <option value="RECHECK">复检任务</option>
                </select>
                <select name="status" lay-filter="statusFilter">
                    <option value="">全部状态</option>
                    <option value="PENDING">待执行</option>
                    <option value="RUNNING">执行中</option>
                    <option value="FINISHED">已完成</option>
                    <option value="FAILED">失败</option>
                </select>
                <button type="button" class="layui-btn layui-btn-primary" id="searchButton">
                    <i class="layui-icon layui-icon-search"></i> 搜索
                </button>
                <button type="button" class="layui-btn layui-btn-primary" id="refreshButton">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新
                </button>
                <button type="button" class="layui-btn" id="addButton">
                    <i class="layui-icon layui-icon-add-1"></i> 新建任务
                </button>
            </div>
        </form>
    </div>

    <div class="table-card" id="taskListPanel">
        <table id="baselineTaskTable" lay-filter="baselineTaskTable"></table>
    </div>

    <div class="table-card result-panel" id="taskResultPanel" style="display:none;">
        <div class="result-panel-head">
            <div>
                <div class="section-kicker">Task Result</div>
                <h2 id="resultTaskTitle">任务结果</h2>
            </div>
            <div class="result-actions">
                <button type="button" class="layui-btn layui-btn-primary" id="backToListButton">返回列表</button>
                <button type="button" class="layui-btn layui-btn-primary" id="resultRefreshButton">
                    <i class="layui-icon layui-icon-refresh"></i> 刷新结果
                </button>
                <button type="button" class="layui-btn layui-btn-warm" id="exportResultButton">
                    <i class="layui-icon layui-icon-export"></i> 导出结果
                </button>
            </div>
        </div>
        <div class="overview-cards" id="overviewCards"></div>
        <div class="result-section-title">主机检测概览</div>
        <table id="taskHostResultTable" lay-filter="taskHostResultTable"></table>
        <div class="task-rule-panel" id="taskRulePanel" style="display:none;">
            <div class="task-rule-head">
                <div>
                    <div class="section-kicker">Task Scope Detail</div>
                    <h3 id="taskRuleTitle">本次任务规则明细</h3>
                </div>
                <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="closeRulePanelButton">收起</button>
            </div>
            <table id="taskRuleResultTable" lay-filter="taskRuleResultTable"></table>
        </div>
    </div>
</div>

<!-- 新建任务弹窗 -->
<template id="baselineTaskFormTemplate">
    <form class="layui-form popup-form baseline-form" lay-filter="baselineTaskForm">
        <div class="layui-form-item">
            <label class="layui-form-label">任务名称</label>
            <div class="layui-input-block">
                <input type="text" name="taskName" autocomplete="off" placeholder="请输入任务名称" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">执行方式</label>
            <div class="layui-input-block">
                <input type="radio" name="executeType" value="MANUAL" title="立即执行" lay-filter="executeType" checked>
                <input type="radio" name="executeType" value="SCHEDULED" title="定时执行" lay-filter="executeType">
            </div>
        </div>
        <div class="layui-form-item" id="scheduleItem" style="display:none;">
            <label class="layui-form-label">执行计划</label>
            <div class="layui-input-block">
                <div class="schedule-row">
                    <select name="scheduleFrequency" class="native-select" lay-ignore>
                        <option value="DAILY">每天</option>
                        <option value="WEEKLY">每周</option>
                        <option value="MONTHLY">每月</option>
                    </select>
                    <select name="scheduleWeekday" class="native-select schedule-extra schedule-weekly" lay-ignore style="display:none;">
                        <option value="MON">周一</option>
                        <option value="TUE">周二</option>
                        <option value="WED">周三</option>
                        <option value="THU">周四</option>
                        <option value="FRI">周五</option>
                        <option value="SAT">周六</option>
                        <option value="SUN">周日</option>
                    </select>
                    <select name="scheduleMonthDay" class="native-select schedule-extra schedule-monthly" lay-ignore style="display:none;"></select>
                    <input type="time" name="scheduleTime" value="02:00" class="layui-input schedule-time" lay-ignore>
                </div>
                <div class="schedule-hint" id="scheduleHint">每天 02:00 执行</div>
            </div>
        </div>

        <div class="layui-form-item baseline-picker-item">
            <label class="layui-form-label">选择主机</label>
            <div class="layui-input-block">
                <div class="picker">
                    <div class="picker-toolbar">
                        <input type="text" class="layui-input picker-search" id="hostSearch" placeholder="搜索主机名 / IP">
                        <span class="picker-count" id="hostCount">已选 0</span>
                    </div>
                    <div class="picker-list" id="hostList">
                        <div class="picker-empty">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item baseline-picker-item">
            <label class="layui-form-label">选择规则</label>
            <div class="layui-input-block">
                <div class="picker">
                    <div class="picker-toolbar">
                        <input type="text" class="layui-input picker-search" id="ruleSearch" placeholder="搜索规则编码 / 名称 / 分类">
                        <label class="picker-checkall"><input type="checkbox" id="ruleCheckAll" checked lay-ignore> 全选</label>
                        <div class="category-actions" id="ruleCategoryActions"></div>
                        <span class="picker-count" id="ruleCount">已选 0</span>
                    </div>
                    <div class="picker-list" id="ruleList">
                        <div class="picker-empty">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="popup-actions">
            <button type="button" class="layui-btn layui-btn-primary" data-action="close">取消</button>
            <button type="button" class="layui-btn" id="submitTaskButton">提交</button>
        </div>
    </form>
</template>

<script src="https://cdn.jsdelivr.net/npm/layui@2.9.21/dist/layui.js"></script>
<script src="../js/common/auth.js"></script>
<script src="../js/common/utils.js"></script>
<script src="../js/common/dialog.js"></script>
<script src="../js/common/request.js"></script>
<script src="../js/common/table.js"></script>
<script src="../js/pages/baseline-task.js"></script>
</body>
</html>
